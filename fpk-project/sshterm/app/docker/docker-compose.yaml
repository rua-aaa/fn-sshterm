services:
  sshterm:
    image: node:20-bookworm-slim
    container_name: sshterm
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    user: "0:0"
    environment:
      PORT: "1070"
      NODE_ENV: production
      SSHTERM_DATA: /data
      SSHTERM_WEB: /app/web/dist
      GATEWAY_PREFIX: /app/sshterm
      SOCKET_PATH: /target/app.sock
      TRIM_APPDEST: /target
      HOME: /data
      npm_config_cache: /data/.npm
    volumes:
      - ${TRIM_APPDEST}/server:/app
      - ${TRIM_APPDEST}:/target
      - ${TRIM_PKGVAR}:/data
      - sshterm_node_modules:/app/node_modules
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /data/.npm /app/web /target
        export HOME=/data npm_config_cache=/data/.npm
        echo "[sshterm-container] node=$$(node -v) hostname=$$(hostname)"
        if [ ! -f /app/node_modules/express/package.json ]; then
          echo "[sshterm-container] npm install ..."
          npm install --omit=dev --ignore-scripts --no-audit --no-fund --cache /data/.npm
        fi
        exec node /app/index.js

volumes:
  sshterm_node_modules:
